<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" role="img" font-family="'Microsoft YaHei', 'PingFang SC', system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>阅读的海洋 · 数据流图</title>
<desc>数据从用户输入经页面写入浏览器本地存储，再读回渲染的完整流向。三个节点横向排列：你、页面、浏览器本地存储，两条双向箭头连接，保存时向右流动，打开页面时向左流回。本地存储只认两个键：reading:books 与 reading:notes。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="35" y="50" width="170" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="120" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">你</text>
<text x="120" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#BA7517">填书、改进度、写笔记</text>

<rect x="260" y="50" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="345" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">页面</text>
<text x="345" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">界面 + 数据层</text>

<rect x="485" y="50" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="570" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">本地存储</text>
<text x="570" y="89" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#0F6E56">reading:books</text>
<text x="570" y="105" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#0F6E56">reading:notes</text>

<line x1="208" y1="85" x2="257" y2="85" stroke="#888780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="433" y1="85" x2="482" y2="85" stroke="#888780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<text x="35" y="140" dominant-baseline="central" font-size="13" font-weight="400" fill="#5F5E5A">保存时：你填的内容 → 界面 → 数据层转成 JSON → 写进存储</text>
<text x="35" y="162" dominant-baseline="central" font-size="13" font-weight="400" fill="#5F5E5A">打开页面：从存储读回来 → 数据层还原成对象 → 界面渲染给你看</text>
</svg>
