<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读的海洋 · 我的读书记录</title>
<!-- 依据 docs/TECH_DESIGN.md 2.6 / 2.7：单页 + 三视图，显示隐藏切换，不做页面跳转 -->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 出错提示条：任何一步操作失败都在这里显示（TECH_DESIGN 3.4 / PRD AC-23） -->
<div id="app-error" class="app-error" hidden></div>

<div class="wrap">

  <!-- ============================================================
       P1 · 书单页（首页）
       PRD 4.1 要求：状态筛选、书籍卡片列表、每张卡片显示
       封面或书名首字 + 书名 + 作者 + 状态 +（在读时）进度、添加按钮
       ============================================================ -->
  <section id="view-list" class="view">

    <header class="topbar">
      <div>
        <h1>阅读的海洋</h1>
        <p class="muted sub">读书记录 · 阅读进度 · 读书笔记</p>
      </div>
      <button id="btn-add-book" class="btn btn-primary" type="button">添加书籍</button>
    </header>

    <!-- 三档状态 + 全部（PRD AC-7） -->
    <nav class="filters" id="filters">
      <button class="filter is-active" type="button" data-status="all">全部</button>
      <button class="filter" type="button" data-status="want">想读</button>
      <button class="filter" type="button" data-status="reading">在读</button>
      <button class="filter" type="button" data-status="finished">已读</button>
    </nav>

    <!-- 书籍卡片由 app.js 生成后塞进这里 -->
    <div id="book-list" class="book-list"></div>

    <!-- 空状态（PRD AC-9）：一本书都没有时显示，而不是一片空白 -->
    <div id="empty-state" class="empty">
      <p class="empty-title">书架还是空的</p>
      <p class="muted">把你正在读、想读、读完的书都放进来，随手记下页码和笔记。</p>
      <button id="btn-add-first" class="btn btn-primary" type="button">添加第一本书</button>
    </div>

    <!-- 筛选后暂时为空（Day 7 补充）：PRD 4.1 原本只规定了上面那种空状态，
         实测发现点了筛选看到一片空白会被当成页面坏了，所以这里给一句话 +
         一个出口。跟上面那个的区别：书是有的，只是当前这一档没有。 -->
    <div id="filter-empty" class="empty" hidden>
      <p id="filter-empty-text" class="empty-title"></p>
      <button id="btn-show-all" class="btn btn-primary" type="button">看全部</button>
    </div>

  </section>

  <!-- ============================================================
       P2 · 书籍详情页
       PRD 4.1 要求：书名、作者、封面、状态切换（三态）、
       进度录入区（想读时不显示）、笔记列表、写笔记、每条笔记的编辑/删除、
       本书的编辑/删除、返回列表的入口
       ============================================================ -->
  <section id="view-detail" class="view" hidden>

    <header class="topbar">
      <button id="btn-back" class="btn btn-ghost" type="button">← 返回书单</button>
      <div class="topbar-actions">
        <button id="btn-edit-book" class="btn" type="button">编辑</button>
        <button id="btn-delete-book" class="btn btn-danger" type="button">删除</button>
      </div>
    </header>

    <div class="detail-head">
      <!-- 封面：app.js 决定放 <img> 还是书名首字占位（TECH_DESIGN 2.8） -->
      <div id="detail-cover" class="cover cover-lg"></div>
      <div class="detail-meta">
        <h2 id="detail-title"></h2>
        <p id="detail-author" class="muted"></p>
        <!-- 三态切换按钮由 app.js 生成 -->
        <div id="detail-status" class="status-switch"></div>
        <p id="detail-finished" class="muted" hidden></p>
      </div>
    </div>

    <!-- 进度区：状态为「想读」时整块隐藏（PRD 4.1） -->
    <div id="progress-box" class="box">
      <h3 class="box-title">阅读进度</h3>
      <p id="progress-view" class="progress-view"></p>
      <div class="progress-form">
        <label class="field-inline">
          当前第
          <input id="input-current-page" type="number" min="0" step="1" inputmode="numeric">
          页
        </label>
        <button id="btn-save-progress" class="btn btn-primary" type="button">保存进度</button>
      </div>
      <p id="progress-hint" class="muted" hidden></p>
    </div>

    <div class="box">
      <div class="box-head">
        <h3 class="box-title">读书笔记 <span id="note-count" class="muted"></span></h3>
        <button id="btn-add-note" class="btn btn-primary" type="button">写笔记</button>
      </div>

      <!-- 笔记编辑区：新增与编辑共用这一块，由 app.js 控制显隐与文案 -->
      <div id="note-editor" class="note-editor" hidden>
        <textarea id="note-content" rows="3" placeholder="写点什么…（只记自己的想法，不抄正文）"></textarea>
        <div class="note-editor-foot">
          <label class="field-inline">
            页码（选填）
            <input id="note-page" type="number" min="0" step="1" inputmode="numeric">
          </label>
          <div class="btn-row">
            <button id="btn-cancel-note" class="btn" type="button">取消</button>
            <button id="btn-save-note" class="btn btn-primary" type="button">保存</button>
          </div>
        </div>
      </div>

      <!-- 笔记列表由 app.js 生成 -->
      <ul id="note-list" class="note-list"></ul>
      <p id="note-empty" class="muted">这本书还没有笔记。</p>
    </div>

  </section>

</div>

<!-- ============================================================
     P3 · 添加 / 编辑书籍弹窗
     PRD 4.1 要求：书名（必填）、作者、封面网址、总页数、保存、取消
     ============================================================ -->
<div id="modal-book" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">添加书籍</h2>

    <form id="form-book" novalidate>
      <label class="field">
        书名 <span class="req">*</span>
        <input id="input-title" type="text" autocomplete="off">
      </label>

      <label class="field">
        作者
        <input id="input-author" type="text" autocomplete="off">
      </label>

      <label class="field">
        封面网址
        <input id="input-cover" type="text" autocomplete="off" placeholder="选填，形如 https://…">
      </label>

      <label class="field">
        总页数
        <input id="input-total" type="number" min="1" step="1" inputmode="numeric" placeholder="选填">
      </label>

      <!-- 表单内的错误提示：弹窗不关闭，就地告诉用户哪里不对（PRD AC-2 / AC-13） -->
      <p id="form-error" class="form-error" hidden></p>

      <div class="modal-foot">
        <button id="btn-cancel-book" class="btn" type="button">取消</button>
        <button id="btn-save-book" class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ============================================================
     ⚠️ 只能用普通 <script>，禁止 type="module" / import / export
     原因见 docs/TECH_DESIGN.md 2.11：用模块方式打开会直接白屏。
     顺序也不能颠倒 —— store.js 必须先于 app.js。
     ============================================================ -->
<script src="store.js"></script>
<script src="app.js"></script>

</body>
</html>
